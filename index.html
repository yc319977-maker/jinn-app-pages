<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8A87C">
<title>JINN GROW 工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <!-- 侧边栏（桌面） -->
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-mask" id="navMask"></div>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn nav-toggle" id="navToggle" aria-label="打开菜单">☰</button>
      <div>
        <div class="title" id="pageTitle">JINN GROW 工作台</div>
        <div class="date" id="pageDate"></div>
      </div>
      <div class="spacer"></div>
      <div class="status" id="statusBadge"><span class="dot"></span><span id="statusText">本地保存中</span></div>
      <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️</button>
    </header>

    <div class="content">
      <div id="view"></div>
    </div>

    <!-- 底部导航（手机） -->
    <nav class="bottomnav" id="bottomnav"></nav>
  </div>
</div>

<!-- 弹窗容器 -->
<div class="modal-host" id="modalHost">
  <div class="modal-mask" data-act="close-modal"></div>
  <div class="modal" id="modalBox"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 数据层 + 应用逻辑（顺序：db.js 必须在 app.js 之前） -->
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
